[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "team-plan"
version = "1.0.0"
description = "Cause-aware intervention planning for collaborative agents under partner uncertainty (Team-Plan)"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Hamed Khosravi" }, { name = "Xiaoming Huo" }]
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.24",
  "pandas>=1.5",
  "scikit-learn>=1.2",
]

[project.optional-dependencies]
plots = ["matplotlib>=3.6"]
dev = ["pytest>=7", "pyyaml>=6", "matplotlib>=3.6"]

[tool.setuptools]
packages = ["ccrp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
