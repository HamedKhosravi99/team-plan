defaults:
  - /llm@plan_config.llm: llama
  - /instruct@plan_config.instruct: zero_shot_dialog_prompt

_target_: 'habitat_llm_ext.planner.PartnerModelRobotPlanner'
_recursive_: False
_partial_: True

plan_config:
    replanning_threshold: 25
    planning_mode: "cot"
    constrained_generation: False
    objects_response: True
    objects_response_include_states: False
    centralized: False
    enable_rag: False
    rag_dataset_dir: ""
    rag_data_source_name: ""
    example_type: "react"
    injection:
      kind: none        # none | goal | world | skill | mixed   (applied only when this planner drives the human)
      seed: 0
      q_skill: 0.5
      seed_by: counter      # counter | episode_id
    partner_model:
      mode: proagent       # proagent (ProAgent, AAAI 2024) | hypminds (Hypothetical Minds, ICLR 2025) | coela (CoELA, ICLR 2024) | introspect (Introspective planning / Ask-to-Act) | llawco (LLawCo w/o SFT, ICML 2026) | proact (ProACT, 2026)
      every_steps: 400     # simulator steps between analyses (Team-Plan's min_gap_steps)
      min_steps: 600       # no analysis before this step (Team-Plan's min_iter_before_intervention)
      history_len: 12
      max_tokens: 220
      n_hypotheses: 3
      max_messages: 2      # coela: direct messages per episode (Team-Plan's cap)
      max_questions: 2     # introspect: clarifying questions per episode
      ask_threshold: 0.25  # introspect: an option enters the prediction set at probability >= this
